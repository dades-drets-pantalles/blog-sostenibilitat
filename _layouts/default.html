<!doctype html>
<html lang="{{ site.lang | default: 'ca' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b24">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b24'/%3E%3Cpath d='M4 16 Q16 5 28 16 Q16 27 4 16Z' fill='none' stroke='%23a78bfa' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233b82f6'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%230b0b24'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Salta al contingut</a>
  <header class="site-header">
    <div class="wrap wide header-row">
      <a class="brand" href="{{ '/' | relative_url }}">Dades, drets<br>i pantalles</a>
      <nav class="site-nav" aria-label="Principal">
        {% assign u = page.url %}
        <a href="{{ '/' | relative_url }}"{% if u == '/' %} aria-current="page"{% endif %}>Inici</a>
        <a href="{{ '/entrades/' | relative_url }}"{% if u == '/entrades/' or page.layout == 'post' %} aria-current="page"{% endif %}>Entrades</a>
        <a href="{{ '/sobre/' | relative_url }}"{% if u == '/sobre/' %} aria-current="page"{% endif %}>Sobre</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap wide footer-row">
      <p><span class="mono">// {{ site.title }}</span><br>{{ site.description }}</p>
      <p class="mono"><a href="{{ '/feed.xml' | relative_url }}">RSS</a> · <a href="{{ '/sobre/' | relative_url }}">Crèdits</a></p>
    </div>
  </footer>
</body>
</html>
